# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings

# Website name is set in params.yaml under hugoblox.identity.name
title: ''
# Website URL
baseURL: 'https://www.clementgodbarge.com/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
# Japanese and Chinese content: correct word counts / reading time / summaries
hasCJKLanguage: true
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
# Keep the URL scheme of the previous site (/tag/..., /category/...)
permalinks:
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
disableAliases: true
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  category: categories
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  exec:
    # HugoBlox Kit compiles Tailwind CSS through Node; Hugo >= 0.163 checks the
    # `tailwindcss` command name against this allow-list, so it must be listed.
    allow: ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^node$', '^npx$', '^postcss$', '^tailwindcss$']
sitemap:
  _merge: deep

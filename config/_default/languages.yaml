# Languages
#   One section per site language. English is the default and stays at the site
#   root; other languages live under /fr/, /es/, /it/.
#   Translations sit next to the originals as `index.<lang>.md` (same bundle, so
#   images and other resources are shared).
#   Documentation: https://docs.hugoblox.com/reference/language/

en:
  locale: en-us
  weight: 1

fr:
  locale: fr-fr
  weight: 2
  params:
    hugoblox:
      identity:
        description: "Site académique de Clément Godbarge, PhD."
      locale:
        date_format: ":date_long"
  menus:
    main:
      - name: Accueil
        url: /fr/
        weight: 10
      - name: Zibaldone
        url: /fr/#posts
        weight: 20
      - name: Projets
        url: /fr/#projects
        weight: 30
      - name: Code
        url: /fr/#code
        weight: 40


# Navigation Links
#   To link a homepage section, specify the URL as `/#` followed by the `id` of the
#   desired block in `content/_index.md`.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /
    weight: 10
  - name: Zibaldone
    url: /#posts
    weight: 20
  - name: Projects
    url: /#projects
    weight: 30
  - name: Code
    url: /#code
    weight: 40

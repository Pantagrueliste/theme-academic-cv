role: Lektor i digital humaniora
bio: |
  Clément Godbarge er lektor i digital humaniora ved University of St Andrews. Hans forskning kredser om videnskab og statskunst i det tidligt moderne Europa. I sin kommende bog undersøger han, hvordan læger ved de franske og italienske hoffer i 1500-tallet gjorde sig gældende som politiske eksperter af en ny slags. Hans forskning har været støttet af Andrew W. Mellon Foundation, Fulbright-kommissionen, Renaissance Society of America og Harvard University.


# French overrides for data/authors/clement.yaml (merged on top of the default)
role: Maître de conférences en humanités numériques
bio: |
  Clément Godbarge est maître de conférences en humanités numériques à l'université de St Andrews. Ses recherches portent sur les rapports entre science et art de gouverner dans l'Europe de la première modernité. Dans son livre à paraître, il examine comment des médecins attachés aux cours de France et d'Italie au XVI^e^ siècle se sont imposés comme des experts politiques d'un genre nouveau. Ses travaux ont été soutenus par la Fondation Andrew W. Mellon, la Commission Fulbright, la Renaissance Society of America et l'université Harvard.


role: Dosen Humaniora Digital
bio: |
  Clément Godbarge adalah dosen humaniora digital di University of St Andrews. Penelitiannya berkisar pada ilmu pengetahuan dan seni memerintah di Eropa awal modern. Dalam bukunya yang akan terbit, ia menelaah bagaimana para dokter di istana Prancis dan Italia abad keenam belas menampilkan diri sebagai pakar politik jenis baru. Penelitiannya didukung oleh Andrew W. Mellon Foundation, Komisi Fulbright, Renaissance Society of America, dan Universitas Harvard.


# Čeština overrides for data/authors/clement.yaml
role: Odborný asistent digitálních humanitních věd
bio: |
  Clément Godbarge působí jako odborný asistent digitálních humanitních věd na University of St Andrews. Jeho výzkum se točí kolem vědy a umění vládnout v raně novověké Evropě. V připravované knize zkoumá, jak se lékaři působící u francouzských a italských dvorů šestnáctého století prosazovali jako političtí odborníci nového typu. Jeho výzkum podpořily Nadace Andrewa W. Mellona, Fulbrightova komise, Renaissance Society of America a Harvardova univerzita.


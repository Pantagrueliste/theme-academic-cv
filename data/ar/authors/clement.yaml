bio: |
  كليمان غودبارج محاضر في الإنسانيات الرقمية بجامعة سانت أندروز. تتناول أبحاثه العلاقة بين العلم وفن الحكم في أوروبا في مطلع العصر الحديث. وفي كتابه الذي سيصدر قريبًا، يدرس كيف قدّم الأطباء الملحقون ببلاطات فرنسا وإيطاليا في القرن السادس عشر أنفسهم بوصفهم خبراء سياسيين من نوع جديد. وقد حظيت أبحاثه بدعم مؤسسة أندرو و. ميلون، ولجنة فولبرايت، وجمعية عصر النهضة الأمريكية، وجامعة هارفارد.


[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  # Pinned to 0.119.0: blox-bootstrap v5.9.7 (the module's final release) fails
  # to build on Hugo >= 0.134 — site.GoogleAnalytics was removed, and 0.146's
  # template rewrite breaks the theme's block lookup. Do not bump without
  # first migrating off blox-bootstrap.
  HUGO_VERSION = "0.119.0"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
